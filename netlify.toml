[build]
  command = "npm install"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[dev]
  command = "npm run dev"
  port = 3000
  framework = "#custom"

# Set headers for better security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://api.replicate.com *; img-src 'self' data: blob: https://replicate.delivery https://*.replicate.delivery *; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js; font-src 'self' https://cdnjs.cloudflare.com;"
    Permissions-Policy = "camera=(self)"

# Redirect to HTTPS
[[redirects]]
  from = "http://*"
  to = "https://:splat"
  status = 301
  force = true

# API proxy for Replicate
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/transform"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200 